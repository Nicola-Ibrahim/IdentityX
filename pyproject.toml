[project]
name = "IdentityX"
version = "0.1.0"
description = "Production-ready Identity & Access Management service built with DDD and FastAPI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "azure-identity>=1.19.0",
    "azure-keyvault-secrets>=4.9.0",
    "dependency-injector>=4.44.0",
    "fastapi[all]>=0.115.6",
    "fastapi-cli>=0.0.6",
    "pydantic>=2.10.3",
    "python-dotenv>=1.0.1",
    "returns>=0.24.0",
    "sqlalchemy>=2.0.36",
    "pyjwt[crypto]>=2.10.1",
    "psycopg>=3.3.3",
    "fastapi-limiter>=0.2.0",
    "psycopg[binary]>=3.2.4",
    "greenlet>=3.1.1",
    "redis>=7.4.0",
    "authlib>=1.7.2",
    "pyotp>=2.9.0",
    "passlib[argon2]>=1.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
lint = ["ruff>=0.8.3"]
dev = [
    "colorlog>=6.9.0",
    "pre-commit>=4.0.1",
    "platform-dev",
]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
]


[tool.ruff]
src = ["."]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 119

[tool.ruff.lint]
extend-ignore = [
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "D206",   # indent-with-spaces
    "D300",   # triple-single-quotes
    "Q000",   # bad-quotes-inline-string
    "Q001",   # bad-quotes-multiline-string
    "Q002",   # bad-quotes-docstring
    "Q003",   # avoidable-escaped-quote
    "COM812", # missing-trailing-comma
    "COM819", # prohibited-trailing-comma
    "ISC001", # single-line-implicit-string-concatenation
    "ISC002", # multi-line-implicit-string-concatenation
]

# Select which error types to lint
select = ["E4", "E7", "E9", "F", "TID"]
# List of ignored lint errors
ignore = ["E501"]
# Fixable lint errors
fixable = ["ALL"]
# Unfixable lint errors
unfixable = ["B"]
# Dummy variable pattern (variable names that can be ignored)
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 20
line-ending = "auto"


[tool.poe.tasks]

# ====================================================================================
# 1. Server Tasks
# ====================================================================================


[tool.poe.tasks.test]
cmd = "pytest"
help = "TEST: Run the test suite. Usage: poe test"

[tool.poe.tasks.test-cov]
cmd = "pytest --cov=src --cov-report=term-missing --cov-report=html"
help = "TEST COV: Run tests with coverage reporting. Usage: poe test-cov"

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "LINT: Check for linting issues using ruff. Usage: poe lint"

[tool.poe.tasks.lint-fix]
cmd = "ruff check . --fix"
help = "LINT FIX: Automatically fix linting issues. Usage: poe lint-fix"

[tool.poe.tasks.format]
cmd = "ruff format ."
help = "FORMAT: Automatically format code using ruff. Usage: poe format"

[tool.poe.tasks.check]
sequence = ["lint", "format"]
ignore_fail = false
help = "CHECK: Run linting and formatting checks. Usage: poe check"

# ====================================================================================
# 2. Management & Dev
# ====================================================================================

[tool.poe.tasks.bootstrap]
cmd = "tob-bootstrap"
help = "BOOTSTRAP: Standardized environment setup. Usage: poe bootstrap"

[tool.poe.tasks.dev]
cmd = "tob-dev"
help = "DEV: Unified environment manager (up/down). Usage: poe dev up"

# ==== pytest ====
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pydantic.PydanticDeprecatedSince20",
]



[tool.uv.sources]
platform-dev = { path = "../Tracing-Objectives-Backwards-Devops/scripts/dev", editable = true }
